name: Generate auth npm lockfile (temporary)
on:
  push:
    branches: [feat/authentication-foundation]
    paths: ['.github/workflows/auth-lockfile-bootstrap.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authentication-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix server --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git diff --cached --quiet || (git commit -m "build(auth): lock Argon2id dependency" && git push origin HEAD:feat/authentication-foundation)
