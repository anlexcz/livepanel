name: Bootstrap server npm lockfile (temporary)
on:
  push:
    branches: [feat/production-state-communication]
    paths: ['.github/workflows/lockfile-bootstrap.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-state-communication
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix server --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git diff --cached --quiet || (git commit -m "build(server): lock websocket dependencies" && git push origin HEAD:feat/production-state-communication)
