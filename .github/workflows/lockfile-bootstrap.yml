name: Bootstrap npm lockfiles (temporary)
on:
  push:
    branches: [feat/backend-foundation]
    paths: ['.github/workflows/lockfile-bootstrap.yml']
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix server --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          test -s server/package-lock.json
      - name: Commit lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          git diff --cached --quiet || (git commit -m "build: pin frontend and backend dependencies" && git push origin HEAD:feat/backend-foundation)
